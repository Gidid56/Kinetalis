name: KMC A-B performance comparison

on:
  push:
    branches: ['refactor/generic-event-system']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          path: refactor
          ref: refactor/generic-event-system

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
          ref: main

      - name: Install compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14 g++-14 ninja-build

      - name: Prepare identical benchmark programs and phase instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p main/tools/performance
          cp refactor/tools/performance/benchmark.cpp refactor/tools/performance/perf_probe.h main/tools/performance/
          python3 refactor/tools/performance/instrument.py main/source/kmc/simulation_impl.hpp refactor/source/kmc/simulation_impl.hpp

          for tree in main refactor; do
            cat >> "$tree/CMakeLists.txt" <<'EOF'

          # Added only to this ephemeral CI checkout (not committed to either branch).
          add_executable(kmc_benchmark tools/performance/benchmark.cpp)
          target_link_libraries(kmc_benchmark PRIVATE Kinetalis::dealloying)
          kinetalis_target_defaults(kmc_benchmark)
          target_include_directories(kmc_benchmark PRIVATE tools/performance)

          add_executable(kmc_benchmark_trace tools/performance/benchmark.cpp)
          target_link_libraries(kmc_benchmark_trace PRIVATE Kinetalis::dealloying)
          kinetalis_target_defaults(kmc_benchmark_trace)
          target_include_directories(kmc_benchmark_trace PRIVATE tools/performance)
          target_compile_definitions(kmc_benchmark_trace PRIVATE KINETALIS_PERF_TRACE)
          EOF
          done

          cat >> refactor/CMakeLists.txt <<'EOF'
          target_compile_definitions(kmc_benchmark PRIVATE KINETALIS_PERF_REFACTOR)
          target_compile_definitions(kmc_benchmark_trace PRIVATE KINETALIS_PERF_REFACTOR)
          EOF

      - name: Configure and build both Release variants
        shell: bash
        run: |
          set -euo pipefail
          for tree in main refactor; do
            cmake -S "$tree" -B "$tree/build/perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
              -DKINETALIS_BUILD_BATCH=OFF -DKINETALIS_BUILD_VIEWER=OFF \
              -DKINETALIS_BUILD_TESTS=OFF -DKINETALIS_ENABLE_PCH=ON
            cmake --build "$tree/build/perf" --target kmc_benchmark kmc_benchmark_trace --parallel 2
          done

      - name: Record host hardware
        run: |
          lscpu | grep -E 'Model name|CPU\(s\)|BogoMIPS|Socket\(s\)' || true
          g++-14 --version | head -1

      - name: Run paired uninstrumented and instrumented benchmarks
        run: |
          python3 refactor/tools/performance/run_compare.py \
            "$PWD/main/build/perf/Release/bin/kmc_benchmark" \
            "$PWD/refactor/build/perf/Release/bin/kmc_benchmark"

      - name: Publish raw samples and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmc-performance-report
          path: performance-report.json
          if-no-files-found: warn
