name: Kinetalis CI

on:
  push:
    branches: [main, 'test/**', 'perf/**', 'analysis/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu | Tests | Debug
            os: ubuntu-24.04
          - name: Windows | Tests | Debug
            os: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DKINETALIS_BUILD_BATCH=OFF
          -DKINETALIS_BUILD_VIEWER=OFF
          -DKINETALIS_BUILD_TESTS=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKINETALIS_BUILD_BATCH=OFF
          -DKINETALIS_BUILD_VIEWER=OFF
          -DKINETALIS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --target kinetalis_tests --parallel 2

      - name: Run tests
        run: ctest --test-dir build/ci --output-on-failure

  batch:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu | Batch | Release
            os: ubuntu-24.04
          - name: Windows | Batch | Release
            os: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build/batch-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DKINETALIS_BUILD_BATCH=ON
          -DKINETALIS_BUILD_VIEWER=OFF
          -DKINETALIS_BUILD_TESTS=OFF

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build/batch-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKINETALIS_BUILD_BATCH=ON
          -DKINETALIS_BUILD_VIEWER=OFF
          -DKINETALIS_BUILD_TESTS=OFF

      - name: Build Batch
        run: cmake --build build/batch-ci --target kinetalis_batch --parallel 2

      - name: Smoke test Batch (Linux)
        if: runner.os == 'Linux'
        run: ./build/batch-ci/Release/bin/kinetalis_batch --help

      - name: Smoke test Batch (Windows)
        if: runner.os == 'Windows'
        run: .\build\batch-ci\Release\bin\kinetalis_batch.exe --help

